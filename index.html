<h1>Health Sync</h1>
<p>Health Sync is a personal, single-user tool. It reads the owner's own fitness data (weight, sleep, heart rate, activity) from the Google Health API to build a private progress dashboard.</p>
<p>It is not offered to the public and has no other users.</p>
